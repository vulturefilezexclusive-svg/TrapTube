name: Build TrapTube unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/native-player-demucs-eq]
    paths:
      - 'ci/source.zip'
      - 'ci/patches/**'
      - '.github/workflows/build-traptube-ipa.yml'

permissions:
  contents: read

concurrency:
  group: traptube-ipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/source.zip || { echo "Upload the base project archive to ci/source.zip"; exit 2; }
          unzip -tq ci/source.zip
          mkdir -p work
          unzip -oq ci/source.zip -d work
          test -f work/TrapTube/TrapTube.xcodeproj/project.pbxproj
          test -f work/TrapTube/scripts/build-unsigned-ipa.sh

      - name: Apply TrapTube source overlays
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_SOURCE="$(find work/TrapTube -type f -name AudioEngineManager.swift -print -quit)"
          VIEW_SOURCE="$(find work/TrapTube -type f -name HomeView.swift -print -quit)"
          MODEL_SOURCE="$(find work/TrapTube -type f -name Track.swift -print -quit)"
          COMPONENTS_FILE="$(find work/TrapTube -type f -name Components.swift -print -quit)"
          test -n "$SERVICE_SOURCE" && test -n "$VIEW_SOURCE" && test -n "$MODEL_SOURCE" && test -n "$COMPONENTS_FILE"
          SERVICES_DIR="$(dirname "$SERVICE_SOURCE")"
          VIEWS_DIR="$(dirname "$VIEW_SOURCE")"
          MODELS_DIR="$(dirname "$MODEL_SOURCE")"
          cp ci/patches/AudioEngineManager.swift "$SERVICES_DIR/AudioEngineManager.swift"
          cp ci/patches/LibraryStore.swift "$SERVICES_DIR/LibraryStore.swift"
          cp ci/patches/ThemeManager.swift "$SERVICES_DIR/ThemeManager.swift"
          cp ci/patches/TypeTypeService.swift "$SERVICES_DIR/TypeTypeService.swift"
          cp ci/patches/StemSeparationService.swift "$SERVICES_DIR/StemSeparationService.swift"
          cp ci/patches/SettingsView.swift "$VIEWS_DIR/SettingsView.swift"
          cp ci/patches/YouTubeView.swift "$VIEWS_DIR/YouTubeView.swift"
          cp ci/patches/StemStudioView.swift "$VIEWS_DIR/StemStudioView.swift"
          python3 ci/patches/KeepImportAction.py work/TrapTube
          cp ci/patches/HTDemucs-ATTRIBUTION.md "$MODELS_DIR/HTDemucs-ATTRIBUTION.md"
          python3 - "$COMPONENTS_FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          source = source.replace('title: "YouTube"', 'title: "TrapTube"')
          path.write_text(source)
          PY

      - name: Make the TrapTube app icon available to the player menu
        shell: bash
        run: |
          set -euo pipefail
          ICON_SET="$(find work/TrapTube -type d -name 'AppIcon.appiconset' -print -quit)"
          if [[ -z "$ICON_SET" ]]; then
            echo "WARNING: AppIcon.appiconset was not found; player menu will use the asset fallback."
            exit 0
          fi
          ICON_SOURCE="$(python3 - "$ICON_SET" <<'PYICON'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          images = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg"}]
          print(max(images, key=lambda p: p.stat().st_size) if images else "")
          PYICON
          )"
          if [[ -z "$ICON_SOURCE" ]]; then
            echo "WARNING: AppIcon.appiconset contains no raster image; player menu will use the asset fallback."
            exit 0
          fi
          ICON_ASSETS="$(dirname "$ICON_SET")"
          mkdir -p "$ICON_ASSETS/TrapTubeIcon.imageset"
          cp "$ICON_SOURCE" "$ICON_ASSETS/TrapTubeIcon.imageset/TrapTubeIcon.png"
          cat > "$ICON_ASSETS/TrapTubeIcon.imageset/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "TrapTubeIcon.png",
                "idiom": "universal"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON
          echo "Prepared TrapTubeIcon from $(basename "$ICON_SOURCE")."

      - name: Add LGPL FFmpegKit Swift package
        shell: bash
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby ci/patches/AddFFmpegKitPackage.rb work/TrapTube/TrapTube.xcodeproj
          xcodebuild -resolvePackageDependencies -project work/TrapTube/TrapTube.xcodeproj -scheme TrapTube

      - name: Download and validate licensed HTDemucs model package
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://github.com/john-rocky/CoreML-Models/releases/download/demucs-v1/HTDemucs_SourceSeparation_F32.mlpackage.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$MODEL_URL" -o "$RUNNER_TEMP/HTDemucs_SourceSeparation_F32.mlpackage.zip"
          unzip -tq "$RUNNER_TEMP/HTDemucs_SourceSeparation_F32.mlpackage.zip"
          mkdir -p "$RUNNER_TEMP/htdemucs-unpacked"
          unzip -oq "$RUNNER_TEMP/HTDemucs_SourceSeparation_F32.mlpackage.zip" -d "$RUNNER_TEMP/htdemucs-unpacked"
          MODEL_DIR="$(find "$RUNNER_TEMP/htdemucs-unpacked" -type d -name 'HTDemucs_SourceSeparation_F32.mlpackage' -print -quit)"
          test -n "$MODEL_DIR"
          test -s "$MODEL_DIR/Manifest.json"
          test -d "$MODEL_DIR/Data"
          find "$MODEL_DIR/Data" -type f -size +1k -print -quit | grep -q .
          MODEL_KB="$(du -sk "$MODEL_DIR" | awk '{print $1}')"
          if [[ "$MODEL_KB" -lt 50000 ]]; then echo "ERROR: HTDemucs package is unexpectedly small ($MODEL_KB KB)."; exit 3; fi
          echo "HTDemucs package size: $(du -sh "$MODEL_DIR" | cut -f1)"
          echo "HTDEMUCS_MODEL_PACKAGE=$MODEL_DIR" >> "$GITHUB_ENV"

      - name: Patch IPA packaging to compile and embed HTDemucs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/TrapTube/scripts/build-unsigned-ipa.sh")
          s = p.read_text()
          anchor = '''EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")
          if [[ ! -f "$APP_PATH/$EXECUTABLE" ]]; then
            echo "ERROR: Compiled executable missing from app bundle: $EXECUTABLE" >&2
            exit 3
          fi

          IPA_PATH="$DIST_DIR/TrapTube-unsigned.ipa"
          '''
          replacement = '''EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")
          if [[ ! -f "$APP_PATH/$EXECUTABLE" ]]; then
            echo "ERROR: Compiled executable missing from app bundle: $EXECUTABLE" >&2
            exit 3
          fi

          MODEL_PACKAGE="${HTDEMUCS_MODEL_PACKAGE:-}"
          if [[ -z "$MODEL_PACKAGE" || ! -d "$MODEL_PACKAGE" ]]; then
            echo "ERROR: HTDEMUCS_MODEL_PACKAGE is not set to the downloaded .mlpackage." >&2
            exit 4
          fi
          xcrun --find coremlcompiler >/dev/null
          COMPILED_MODELS="$BUILD_ROOT/CompiledModels"
          rm -rf "$COMPILED_MODELS"
          mkdir -p "$COMPILED_MODELS"
          xcrun coremlcompiler compile "$MODEL_PACKAGE" "$COMPILED_MODELS"
          COMPILED_MODEL="$COMPILED_MODELS/HTDemucs_SourceSeparation_F32.mlmodelc"
          if [[ ! -d "$COMPILED_MODEL" || ! -s "$COMPILED_MODEL/model.mil" || ! -s "$COMPILED_MODEL/coremldata.bin" ]]; then
            echo "ERROR: coremlcompiler did not produce the expected compiled model." >&2
            find "$COMPILED_MODELS" -maxdepth 2 -print >&2 || true
            exit 4
          fi
          # Fail the build if the downloaded model contract diverges from the Swift adapter.
          python3 - "$COMPILED_MODEL/metadata.json" <<'PYMODEL'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          if isinstance(metadata, list):
              metadata = metadata[0]
          def schema(key):
              return {item["name"]: (item["dataType"], item["shape"]) for item in metadata[key]}
          expected_inputs = {
              "audio_waveform": ("Float16", "[1, 2, 343980]"),
              "spectral_magnitude": ("Float16", "[1, 4, 2048, 336]"),
          }
          expected_outputs = {
              "time_output": ("Float16", "[1, 8, 343980]"),
              "freq_output": ("Float16", "[1, 16, 2048, 336]"),
          }
          actual_inputs, actual_outputs = schema("inputSchema"), schema("outputSchema")
          if actual_inputs != expected_inputs or actual_outputs != expected_outputs:
              raise SystemExit("HTDemucs model I/O schema mismatch: inputs=%r outputs=%r" % (actual_inputs, actual_outputs))
          print("Verified HTDemucs Float16 I/O schema and tensor dimensions.")
          PYMODEL
          STEM_SOURCE="$(find "$PROJECT_ROOT" -type f -name StemSeparationService.swift -print -quit)"
          TRACK_SOURCE="$(find "$PROJECT_ROOT" -type f -name Track.swift -print -quit)"
          test -n "$STEM_SOURCE" && test -n "$TRACK_SOURCE"
          grep -q 'sourceOrder: \[Stem\] = \[.drums, .bass, .other, .vocals\]' "$STEM_SOURCE"
          grep -q 'validateDSPRoundTrip' "$STEM_SOURCE"
          ditto "$COMPILED_MODEL" "$APP_PATH/HTDemucs_SourceSeparation_F32.mlmodelc"
          ATTRIBUTION="$(dirname "$TRACK_SOURCE")/HTDemucs-ATTRIBUTION.md"
          if [[ ! -s "$ATTRIBUTION" ]]; then
            echo "ERROR: HTDemucs MIT license/attribution file is missing." >&2
            exit 4
          fi
          cp "$ATTRIBUTION" "$APP_PATH/HTDemucs-ATTRIBUTION.md"
          cp "$GITHUB_WORKSPACE/ci/patches/FFmpegKit-LICENSE" "$APP_PATH/FFmpegKit-LICENSE"
          cp "$GITHUB_WORKSPACE/ci/patches/FFmpegKit-NOTICE.md" "$APP_PATH/FFmpegKit-NOTICE.md"

          IPA_PATH="$DIST_DIR/TrapTube-unsigned.ipa"
          '''
          if anchor not in s:
            raise SystemExit("Build script anchor not found; refusing to patch packaging blindly.")
          s = s.replace(anchor, replacement, 1)
          verify_anchor = '''/usr/bin/unzip -tq "$IPA_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGING/Payload/TrapTube.app/Info.plist"
          /usr/bin/shasum -a 256 "$IPA_PATH" > "$DIST_DIR/SHA256SUMS.txt"
          '''
          verify_replacement = '''/usr/bin/unzip -tq "$IPA_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGING/Payload/TrapTube.app/Info.plist"
          /usr/bin/unzip -Z1 "$IPA_PATH" > "$BUILD_ROOT/ipa-files.txt"
          grep -qx 'Payload/TrapTube.app/HTDemucs_SourceSeparation_F32.mlmodelc/model.mil' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: compiled HTDemucs model program missing from IPA." >&2; exit 5; }
          grep -qx 'Payload/TrapTube.app/HTDemucs_SourceSeparation_F32.mlmodelc/coremldata.bin' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: compiled HTDemucs model weights missing from IPA." >&2; exit 5; }
          grep -qx 'Payload/TrapTube.app/HTDemucs-ATTRIBUTION.md' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: HTDemucs attribution missing from IPA." >&2; exit 5; }
          grep -qx 'Payload/TrapTube.app/FFmpegKit-LICENSE' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: FFmpegKit LGPL license missing from IPA." >&2; exit 5; }
          grep -qx 'Payload/TrapTube.app/FFmpegKit-NOTICE.md' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: FFmpegKit notice missing from IPA." >&2; exit 5; }
          /usr/bin/shasum -a 256 "$IPA_PATH" > "$DIST_DIR/SHA256SUMS.txt"
          '''
          if verify_anchor not in s:
            raise SystemExit("IPA verification anchor not found; refusing to patch packaging blindly.")
          s = s.replace(verify_anchor, verify_replacement, 1)
          p.write_text(s)
          PY

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work/TrapTube
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Embed Swift runtime dependencies required by FFmpegKit
        shell: bash
        run: |
          set -euo pipefail
          IPA="work/TrapTube/dist/TrapTube-unsigned.ipa"
          test -s "$IPA" || { echo "ERROR: unsigned IPA missing before runtime embedding."; exit 6; }
          STAGING="$RUNNER_TEMP/traptube-swift-runtime"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto -x -k "$IPA" "$STAGING"
          APP_PATH="$STAGING/Payload/TrapTube.app"
          test -d "$APP_PATH/Frameworks" || { echo "ERROR: app Frameworks directory missing."; exit 6; }
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -s "$APP_PATH/$EXECUTABLE"
          SWIFT_STDLIB_TOOL="$(xcrun --find swift-stdlib-tool)"
          echo "Embedding Swift runtime libraries referenced by the app and bundled frameworks."
          "$SWIFT_STDLIB_TOOL" --copy --verbose \
            --scan-executable "$APP_PATH/$EXECUTABLE" \
            --scan-folder "$APP_PATH/Frameworks" \
            --destination "$APP_PATH/Frameworks" \
            --platform iphoneos
          # Fail early if any bundled binary still references an absent Swift runtime dylib.
          python3 - "$APP_PATH" <<'PYVERIFY'
          from pathlib import Path
          import subprocess, sys
          app = Path(sys.argv[1])
          frameworks = app / "Frameworks"
          binaries = [app / subprocess.check_output(
              ["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleExecutable", str(app / "Info.plist")],
              text=True).strip()]
          binaries += [p for p in frameworks.rglob("*") if p.is_file() and (p.suffix == ".dylib" or ".framework" in str(p) and p.name == p.parent.name)]
          missing = set()
          for binary in binaries:
              try:
                  output = subprocess.check_output(["/usr/bin/otool", "-L", str(binary)], text=True, stderr=subprocess.DEVNULL)
              except (subprocess.CalledProcessError, OSError):
                  continue
              for line in output.splitlines()[1:]:
                  dep = line.strip().split(" (", 1)[0]
                  if dep.startswith("@rpath/libswift") and dep.endswith(".dylib"):
                      name = Path(dep).name
                      if not (frameworks / name).is_file():
                          missing.add(f"{binary}: {name}")
          if missing:
              raise SystemExit("Missing embedded Swift runtime dependencies:\\n" + "\\n".join(sorted(missing)))
          required = frameworks / "libswiftCoreMedia.dylib"
          if not required.is_file():
              raise SystemExit("libswiftCoreMedia.dylib was not embedded; refusing to ship an IPA that will fail at launch.")
          print("Verified libswiftCoreMedia.dylib and all scanned @rpath/libswift*.dylib dependencies are embedded.")
          PYVERIFY
          REPACK="$RUNNER_TEMP/TrapTube-runtime-fixed.ipa"
          (cd "$STAGING" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/$REPACK" Payload)
          mv "$GITHUB_WORKSPACE/$REPACK" "$IPA"
          /usr/bin/unzip -tq "$IPA"
          /usr/bin/shasum -a 256 "$IPA" > work/TrapTube/dist/SHA256SUMS.txt

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrapTube-unsigned-IPA
          path: |
            work/TrapTube/dist/TrapTube-unsigned.ipa
            work/TrapTube/dist/SHA256SUMS.txt
            work/TrapTube/dist/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
