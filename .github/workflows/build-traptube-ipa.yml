name: Build TrapTube unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/native-player-demucs-eq]
    paths:
      - 'ci/source.zip'
      - 'ci/patches/**'
      - '.github/workflows/build-traptube-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/source.zip || { echo "Upload the base project archive to ci/source.zip"; exit 2; }
          unzip -tq ci/source.zip
          mkdir -p work
          unzip -oq ci/source.zip -d work
          test -f work/TrapTube/TrapTube.xcodeproj/project.pbxproj
          test -f work/TrapTube/scripts/build-unsigned-ipa.sh

      - name: Apply TrapTube source overlays
        shell: bash
        run: |
          set -euo pipefail
          cp ci/patches/AudioEngineManager.swift work/TrapTube/TrapTube/TrapTube/Services/AudioEngineManager.swift
          cp ci/patches/LibraryStore.swift work/TrapTube/TrapTube/TrapTube/Services/LibraryStore.swift
          cp ci/patches/ThemeManager.swift work/TrapTube/TrapTube/TrapTube/Services/ThemeManager.swift
          cp ci/patches/TypeTypeService.swift work/TrapTube/TrapTube/TrapTube/Services/TypeTypeService.swift
          cp ci/patches/StemSeparationService.swift work/TrapTube/TrapTube/TrapTube/TrapTube/Services/StemSeparationService.swift
          cp ci/patches/SettingsView.swift work/TrapTube/TrapTube/TrapTube/Views/SettingsView.swift
          cp ci/patches/YouTubeView.swift work/TrapTube/TrapTube/TrapTube/Views/YouTubeView.swift
          cp ci/patches/StemStudioView.swift work/TrapTube/TrapTube/TrapTube/Views/StemStudioView.swift
          python3 ci/patches/KeepImportAction.py work/TrapTube/TrapTube
          cp ci/patches/HTDemucs-ATTRIBUTION.md work/TrapTube/TrapTube/TrapTube/Models/HTDemucs-ATTRIBUTION.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path("work/TrapTube/TrapTube/TrapTube/Views/Components.swift")
          source = path.read_text()
          source = source.replace('title: "YouTube"', 'title: "Videos"')
          path.write_text(source)
          PY

      - name: Download and validate licensed HTDemucs model package
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://github.com/john-rocky/CoreML-Models/releases/download/demucs-v1/HTDemucs_SourceSeparation_F32.mlpackage.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$MODEL_URL" -o "$RUNNER_TEMP/HTDemucs_SourceSeparation_F32.mlpackage.zip"
          unzip -tq "$RUNNER_TEMP/HTDemucs_SourceSeparation_F32.mlpackage.zip"
          mkdir -p "$RUNNER_TEMP/htdemucs-unpacked"
          unzip -oq "$RUNNER_TEMP/HTDemucs_SourceSeparation_F32.mlpackage.zip" -d "$RUNNER_TEMP/htdemucs-unpacked"
          MODEL_DIR="$(find "$RUNNER_TEMP/htdemucs-unpacked" -type d -name 'HTDemucs_SourceSeparation_F32.mlpackage' -print -quit)"
          test -n "$MODEL_DIR"
          test -s "$MODEL_DIR/Manifest.json"
          test -d "$MODEL_DIR/Data"
          find "$MODEL_DIR/Data" -type f -size +1k -print -quit | grep -q .
          MODEL_KB="$(du -sk "$MODEL_DIR" | awk '{print $1}')"
          if [[ "$MODEL_KB" -lt 50000 ]]; then echo "ERROR: HTDemucs package is unexpectedly small ($MODEL_KB KB)."; exit 3; fi
          echo "HTDemucs package size: $(du -sh "$MODEL_DIR" | cut -f1)"
          echo "HTDEMUCS_MODEL_PACKAGE=$MODEL_DIR" >> "$GITHUB_ENV"

      - name: Patch IPA packaging to compile and embed HTDemucs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/TrapTube/scripts/build-unsigned-ipa.sh")
          s = p.read_text()
          anchor = '''EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")
          if [[ ! -f "$APP_PATH/$EXECUTABLE" ]]; then
            echo "ERROR: Compiled executable missing from app bundle: $EXECUTABLE" >&2
            exit 3
          fi

          IPA_PATH="$DIST_DIR/TrapTube-unsigned.ipa"
          '''
          replacement = '''EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")
          if [[ ! -f "$APP_PATH/$EXECUTABLE" ]]; then
            echo "ERROR: Compiled executable missing from app bundle: $EXECUTABLE" >&2
            exit 3
          fi

          MODEL_PACKAGE="${HTDEMUCS_MODEL_PACKAGE:-}"
          if [[ -z "$MODEL_PACKAGE" || ! -d "$MODEL_PACKAGE" ]]; then
            echo "ERROR: HTDEMUCS_MODEL_PACKAGE is not set to the downloaded .mlpackage." >&2
            exit 4
          fi
          xcrun --find coremlcompiler >/dev/null
          COMPILED_MODELS="$BUILD_ROOT/CompiledModels"
          rm -rf "$COMPILED_MODELS"
          mkdir -p "$COMPILED_MODELS"
          xcrun coremlcompiler compile "$MODEL_PACKAGE" "$COMPILED_MODELS"
          COMPILED_MODEL="$COMPILED_MODELS/HTDemucs_SourceSeparation_F32.mlmodelc"
          if [[ ! -d "$COMPILED_MODEL" || ! -s "$COMPILED_MODEL/model.mil" || ! -s "$COMPILED_MODEL/coremldata.bin" ]]; then
            echo "ERROR: coremlcompiler did not produce the expected compiled model." >&2
            find "$COMPILED_MODELS" -maxdepth 2 -print >&2 || true
            exit 4
          fi
          # Fail the build if the downloaded model contract diverges from the Swift adapter.
          python3 - "$COMPILED_MODEL/metadata.json" <<'PYMODEL'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          if isinstance(metadata, list):
              metadata = metadata[0]
          def schema(key):
              return {item["name"]: (item["dataType"], item["shape"]) for item in metadata[key]}
          expected_inputs = {
              "audio_waveform": ("Float16", "[1, 2, 343980]"),
              "spectral_magnitude": ("Float16", "[1, 4, 2048, 336]"),
          }
          expected_outputs = {
              "time_output": ("Float16", "[1, 8, 343980]"),
              "freq_output": ("Float16", "[1, 16, 2048, 336]"),
          }
          actual_inputs, actual_outputs = schema("inputSchema"), schema("outputSchema")
          if actual_inputs != expected_inputs or actual_outputs != expected_outputs:
              raise SystemExit("HTDemucs model I/O schema mismatch: inputs=%r outputs=%r" % (actual_inputs, actual_outputs))
          print("Verified HTDemucs Float16 I/O schema and tensor dimensions.")
          PYMODEL
          grep -q 'sourceOrder: \[Stem\] = \[.drums, .bass, .other, .vocals\]' TrapTube/TrapTube/Services/StemSeparationService.swift
          grep -q 'validateDSPRoundTrip' TrapTube/TrapTube/Services/StemSeparationService.swift
          ditto "$COMPILED_MODEL" "$APP_PATH/HTDemucs_SourceSeparation_F32.mlmodelc"
          ATTRIBUTION="$PROJECT_ROOT/TrapTube/TrapTube/Models/HTDemucs-ATTRIBUTION.md"
          if [[ ! -s "$ATTRIBUTION" ]]; then
            echo "ERROR: HTDemucs MIT license/attribution file is missing." >&2
            exit 4
          fi
          cp "$ATTRIBUTION" "$APP_PATH/HTDemucs-ATTRIBUTION.md"

          IPA_PATH="$DIST_DIR/TrapTube-unsigned.ipa"
          '''
          if anchor not in s:
            raise SystemExit("Build script anchor not found; refusing to patch packaging blindly.")
          s = s.replace(anchor, replacement, 1)
          verify_anchor = '''/usr/bin/unzip -tq "$IPA_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGING/Payload/TrapTube.app/Info.plist"
          /usr/bin/shasum -a 256 "$IPA_PATH" > "$DIST_DIR/SHA256SUMS.txt"
          '''
          verify_replacement = '''/usr/bin/unzip -tq "$IPA_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGING/Payload/TrapTube.app/Info.plist"
          /usr/bin/unzip -Z1 "$IPA_PATH" > "$BUILD_ROOT/ipa-files.txt"
          grep -qx 'Payload/TrapTube.app/HTDemucs_SourceSeparation_F32.mlmodelc/model.mil' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: compiled HTDemucs model program missing from IPA." >&2; exit 5; }
          grep -qx 'Payload/TrapTube.app/HTDemucs_SourceSeparation_F32.mlmodelc/coremldata.bin' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: compiled HTDemucs model weights missing from IPA." >&2; exit 5; }
          grep -qx 'Payload/TrapTube.app/HTDemucs-ATTRIBUTION.md' "$BUILD_ROOT/ipa-files.txt" || { echo "ERROR: HTDemucs attribution missing from IPA." >&2; exit 5; }
          /usr/bin/shasum -a 256 "$IPA_PATH" > "$DIST_DIR/SHA256SUMS.txt"
          '''
          if verify_anchor not in s:
            raise SystemExit("IPA verification anchor not found; refusing to patch packaging blindly.")
          s = s.replace(verify_anchor, verify_replacement, 1)
          p.write_text(s)
          PY

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work/TrapTube
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrapTube-unsigned-IPA
          path: |
            work/TrapTube/dist/TrapTube-unsigned.ipa
            work/TrapTube/dist/SHA256SUMS.txt
            work/TrapTube/dist/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
