name: Build TrapTube unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_candidate:
        description: "Build an unsigned IPA after model validation is complete"
        required: true
        type: boolean
        default: false
  push:
    branches: [main, master, feature/native-player-demucs-eq, feature/ytlite-style-download-quality]
    paths:
      - 'ci/source.zip'
      - 'ci/patches/**'
      - '.github/workflows/build-traptube-ipa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/source.zip'
      - 'ci/patches/**'
      - '.github/workflows/build-traptube-ipa.yml'

permissions:
  contents: read

concurrency:
  group: traptube-ipa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/source.zip
          unzip -tq ci/source.zip
          mkdir -p work
          unzip -oq ci/source.zip -d work
          test -f work/TrapTube/TrapTube.xcodeproj/project.pbxproj

      - name: Apply TrapTube source overlays
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_SOURCE="$(find work/TrapTube -type f -name AudioEngineManager.swift -print -quit)"
          VIEW_SOURCE="$(find work/TrapTube -type f -name HomeView.swift -print -quit)"
          MODEL_SOURCE="$(find work/TrapTube -type f -name Track.swift -print -quit)"
          COMPONENTS_FILE="$(find work/TrapTube -type f -name Components.swift -print -quit)"
          test -n "$SERVICE_SOURCE" && test -n "$VIEW_SOURCE" && test -n "$MODEL_SOURCE" && test -n "$COMPONENTS_FILE"
          SERVICES_DIR="$(dirname "$SERVICE_SOURCE")"
          VIEWS_DIR="$(dirname "$VIEW_SOURCE")"
          MODELS_DIR="$(dirname "$MODEL_SOURCE")"
          cp ci/patches/AudioEngineManager.swift "$SERVICES_DIR/AudioEngineManager.swift"
          cp ci/patches/LibraryStore.swift "$SERVICES_DIR/LibraryStore.swift"
          cp ci/patches/ThemeManager.swift "$SERVICES_DIR/ThemeManager.swift"
          cp ci/patches/MediaDownloadService.swift "$SERVICES_DIR/MediaDownloadService.swift"
          python3 ci/patches/RenameLegacyDownloadService.py "$SERVICES_DIR" "$(find work/TrapTube -type f -name project.pbxproj -print -quit)"
          cp ci/patches/GoogleYouTubeAuth.swift "$SERVICES_DIR/GoogleYouTubeAuth.swift"
          cp ci/patches/StemSeparationService.swift "$SERVICES_DIR/StemSeparationService.swift"
          cp ci/patches/SettingsView.swift "$VIEWS_DIR/SettingsView.swift"
          cp ci/patches/YouTubeView.swift "$VIEWS_DIR/YouTubeView.swift"
          cp ci/patches/StemStudioView.swift "$VIEWS_DIR/StemStudioView.swift"
          cp ci/patches/HTDemucs-ATTRIBUTION.md "$MODELS_DIR/HTDemucs-ATTRIBUTION.md"
          python3 ci/patches/KeepImportAction.py work/TrapTube
          python3 ci/patches/ApplyVisualFeatures.py work/TrapTube
          python3 ci/patches/ValidateNativeDownloader.py "$SERVICES_DIR/MediaDownloadService.swift" "$VIEWS_DIR/YouTubeView.swift" "$VIEWS_DIR/SettingsView.swift"
          python3 - "$COMPONENTS_FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text().replace('title: "YouTube"', 'title: "TrapTube"')
          path.write_text(source)
          PY

      - name: Make the TrapTube app icon available to the player menu
        shell: bash
        run: |
          set -euo pipefail
          ICON_SET="$(find work/TrapTube -type d -name 'AppIcon.appiconset' -print -quit)"
          if [[ -n "$ICON_SET" ]]; then
            ICON_SOURCE="$(python3 - "$ICON_SET" <<'PYICON'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          images = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg"}]
          print(max(images, key=lambda p: p.stat().st_size) if images else "")
          PYICON
          )"
            if [[ -n "$ICON_SOURCE" ]]; then
              ICON_ASSETS="$(dirname "$ICON_SET")"
              mkdir -p "$ICON_ASSETS/TrapTubeIcon.imageset"
              cp "$ICON_SOURCE" "$ICON_ASSETS/TrapTubeIcon.imageset/TrapTubeIcon.png"
              cat > "$ICON_ASSETS/TrapTubeIcon.imageset/Contents.json" <<'JSON'
          {
            "images": [{"filename": "TrapTubeIcon.png", "idiom": "universal"}],
            "info": {"author": "xcode", "version": 1}
          }
          JSON
            fi
          fi

      - name: Resolve FFmpegKit and Demucs packages
        shell: bash
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          GOOGLE_AUTH_SOURCE="$(find work/TrapTube -type f -name GoogleYouTubeAuth.swift -print -quit)"
          test -n "$GOOGLE_AUTH_SOURCE"
          ruby ci/patches/AddFFmpegKitPackage.rb work/TrapTube/TrapTube.xcodeproj "$GOOGLE_AUTH_SOURCE"
          xcodebuild -resolvePackageDependencies -project work/TrapTube/TrapTube.xcodeproj -scheme TrapTube

      - name: Compile TrapTube for device without packaging an IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project work/TrapTube/TrapTube.xcodeproj \
            -scheme TrapTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Download and smoke-test HTDemucs FT on Metal
        shell: bash
        run: |
          set -euo pipefail
          swift run --package-path ci/demucs-smoke


  build:
    needs: validate
    if: always() && github.event_name == 'workflow_dispatch' && inputs.build_candidate && needs.validate.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/source.zip || { echo "Upload the base project archive to ci/source.zip"; exit 2; }
          unzip -tq ci/source.zip
          mkdir -p work
          unzip -oq ci/source.zip -d work
          test -f work/TrapTube/TrapTube.xcodeproj/project.pbxproj
          test -f work/TrapTube/scripts/build-unsigned-ipa.sh

      - name: Apply TrapTube source overlays
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_SOURCE="$(find work/TrapTube -type f -name AudioEngineManager.swift -print -quit)"
          VIEW_SOURCE="$(find work/TrapTube -type f -name HomeView.swift -print -quit)"
          MODEL_SOURCE="$(find work/TrapTube -type f -name Track.swift -print -quit)"
          COMPONENTS_FILE="$(find work/TrapTube -type f -name Components.swift -print -quit)"
          test -n "$SERVICE_SOURCE" && test -n "$VIEW_SOURCE" && test -n "$MODEL_SOURCE" && test -n "$COMPONENTS_FILE"
          SERVICES_DIR="$(dirname "$SERVICE_SOURCE")"
          VIEWS_DIR="$(dirname "$VIEW_SOURCE")"
          MODELS_DIR="$(dirname "$MODEL_SOURCE")"
          cp ci/patches/AudioEngineManager.swift "$SERVICES_DIR/AudioEngineManager.swift"
          cp ci/patches/LibraryStore.swift "$SERVICES_DIR/LibraryStore.swift"
          cp ci/patches/ThemeManager.swift "$SERVICES_DIR/ThemeManager.swift"
          cp ci/patches/MediaDownloadService.swift "$SERVICES_DIR/MediaDownloadService.swift"
          python3 ci/patches/RenameLegacyDownloadService.py "$SERVICES_DIR" "$(find work/TrapTube -type f -name project.pbxproj -print -quit)"
          cp ci/patches/GoogleYouTubeAuth.swift "$SERVICES_DIR/GoogleYouTubeAuth.swift"
          cp ci/patches/StemSeparationService.swift "$SERVICES_DIR/StemSeparationService.swift"
          cp ci/patches/SettingsView.swift "$VIEWS_DIR/SettingsView.swift"
          cp ci/patches/YouTubeView.swift "$VIEWS_DIR/YouTubeView.swift"
          cp ci/patches/StemStudioView.swift "$VIEWS_DIR/StemStudioView.swift"
          python3 ci/patches/KeepImportAction.py work/TrapTube
          python3 ci/patches/ApplyVisualFeatures.py work/TrapTube
          cp ci/patches/HTDemucs-ATTRIBUTION.md "$MODELS_DIR/HTDemucs-ATTRIBUTION.md"
          python3 - "$COMPONENTS_FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          source = source.replace('title: "YouTube"', 'title: "TrapTube"')
          path.write_text(source)
          PY

      - name: Export app source files for feature integration review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("work/TrapTube")
          output = Path("review-source")
          names = {"RootView.swift", "PlayerView.swift", "TrapTubeApp.swift", "HomeView.swift", "YouTubeView.swift", "StemStudioView.swift", "AudioEngineManager.swift"}
          copied = 0
          for source in root.rglob("*.swift"):
              if source.name in names:
                  target = output / source.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  print(f"Exported {source}")
                  copied += 1
          if copied == 0:
              raise SystemExit("No review source files were found.")
          PY
      - name: Upload app source review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrapTube-source-review
          path: review-source/
          retention-days: 3

      - name: Make the TrapTube app icon available to the player menu
        shell: bash
        run: |
          set -euo pipefail
          ICON_SET="$(find work/TrapTube -type d -name 'AppIcon.appiconset' -print -quit)"
          if [[ -z "$ICON_SET" ]]; then
            echo "WARNING: AppIcon.appiconset was not found; player menu will use the asset fallback."
            exit 0
          fi
          ICON_SOURCE="$(python3 - "$ICON_SET" <<'PYICON'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          images = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg"}]
          print(max(images, key=lambda p: p.stat().st_size) if images else "")
          PYICON
          )"
          if [[ -z "$ICON_SOURCE" ]]; then
            echo "WARNING: AppIcon.appiconset contains no raster image; player menu will use the asset fallback."
            exit 0
          fi
          ICON_ASSETS="$(dirname "$ICON_SET")"
          mkdir -p "$ICON_ASSETS/TrapTubeIcon.imageset"
          cp "$ICON_SOURCE" "$ICON_ASSETS/TrapTubeIcon.imageset/TrapTubeIcon.png"
          cat > "$ICON_ASSETS/TrapTubeIcon.imageset/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "TrapTubeIcon.png",
                "idiom": "universal"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON
          echo "Prepared TrapTubeIcon from $(basename "$ICON_SOURCE")."

      - name: Add LGPL FFmpegKit Swift package
        shell: bash
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          GOOGLE_AUTH_SOURCE="$(find work/TrapTube -type f -name GoogleYouTubeAuth.swift -print -quit)"
          test -n "$GOOGLE_AUTH_SOURCE"
          ruby ci/patches/AddFFmpegKitPackage.rb work/TrapTube/TrapTube.xcodeproj "$GOOGLE_AUTH_SOURCE"
          xcodebuild -resolvePackageDependencies -project work/TrapTube/TrapTube.xcodeproj -scheme TrapTube

      - name: Download and smoke-test HTDemucs FT on Metal
        shell: bash
        run: |
          set -euo pipefail
          swift run --package-path ci/demucs-smoke

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work/TrapTube
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Add third-party notices to app bundle
        shell: bash
        run: |
          set -euo pipefail
          IPA="work/TrapTube/dist/TrapTube-unsigned.ipa"
          STAGING="$RUNNER_TEMP/traptube-third-party-notices"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto -x -k "$IPA" "$STAGING"
          APP_PATH="$STAGING/Payload/TrapTube.app"
          cp ci/patches/HTDemucs-ATTRIBUTION.md "$APP_PATH/HTDemucs-ATTRIBUTION.md"
          cp ci/patches/FFmpegKit-LICENSE "$APP_PATH/FFmpegKit-LICENSE"
          cp ci/patches/FFmpegKit-NOTICE.md "$APP_PATH/FFmpegKit-NOTICE.md"
          REPACK="$RUNNER_TEMP/TrapTube-third-party-notices.ipa"
          (cd "$STAGING" && /usr/bin/zip -qry "$REPACK" Payload)
          mv "$REPACK" "$IPA"
          /usr/bin/unzip -tq "$IPA"
          echo "Added Demucs and FFmpegKit third-party notices to the app bundle."

      - name: Embed Swift runtime dependencies required by FFmpegKit
        shell: bash
        run: |
          set -euo pipefail
          IPA="work/TrapTube/dist/TrapTube-unsigned.ipa"
          test -s "$IPA" || { echo "ERROR: unsigned IPA missing before runtime embedding."; exit 6; }
          STAGING="$RUNNER_TEMP/traptube-swift-runtime"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto -x -k "$IPA" "$STAGING"
          APP_PATH="$STAGING/Payload/TrapTube.app"
          test -d "$APP_PATH/Frameworks" || { echo "ERROR: app Frameworks directory missing."; exit 6; }
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          # FFmpegKit's libavcodec was incorrectly linked to the Swift CoreMedia
          # overlay for a C symbol that is exported by Apple's CoreMedia framework.
          # Redirect that load command to the actual system framework before embedding
          # Swift runtime dependencies.
          FIXED_COREMEDIA=0
          while IFS= read -r -d '' BINARY; do
            if /usr/bin/otool -L "$BINARY" 2>/dev/null | grep -Fq '@rpath/libswiftCoreMedia.dylib'; then
              echo "Correcting CoreMedia provider in: $BINARY"
              /usr/bin/install_name_tool -change \
                '@rpath/libswiftCoreMedia.dylib' \
                '/System/Library/Frameworks/CoreMedia.framework/CoreMedia' \
                "$BINARY"
              FIXED_COREMEDIA=$((FIXED_COREMEDIA + 1))
            fi
          done < <(find "$APP_PATH/Frameworks" -type f -print0)
          if [[ "$FIXED_COREMEDIA" -eq 0 ]]; then
            echo "ERROR: No bundled binary referenced @rpath/libswiftCoreMedia.dylib; expected FFmpeg linkage was not found." >&2
            exit 7
          fi
          echo "Corrected $FIXED_COREMEDIA bundled binary/binaries to use Apple's CoreMedia framework."
          # Verify the incorrect provider is gone and the system CoreMedia dependency is present.
          python3 - "$APP_PATH/Frameworks" <<'PYCOREMEDIA'
          from pathlib import Path
          import subprocess, sys
          root = Path(sys.argv[1])
          stale = []
          corrected = []
          for binary in root.rglob("*"):
              if not binary.is_file():
                  continue
              try:
                  deps = subprocess.check_output(["/usr/bin/otool", "-L", str(binary)], text=True, stderr=subprocess.DEVNULL)
              except (subprocess.CalledProcessError, OSError):
                  continue
              if "@rpath/libswiftCoreMedia.dylib" in deps:
                  stale.append(str(binary))
              if "/System/Library/Frameworks/CoreMedia.framework/CoreMedia" in deps:
                  corrected.append(str(binary))
          if stale:
              raise SystemExit("Incorrect Swift CoreMedia dependency remains:\\n" + "\\n".join(stale))
          if not corrected:
              raise SystemExit("No binary contains the corrected system CoreMedia dependency.")
          print("Verified corrected CoreMedia dependency in: " + ", ".join(corrected))
          PYCOREMEDIA
          test -s "$APP_PATH/$EXECUTABLE"
          SWIFT_STDLIB_TOOL="$(xcrun --find swift-stdlib-tool)"
          echo "Embedding Swift runtime libraries referenced by the app and bundled frameworks."
          "$SWIFT_STDLIB_TOOL" --copy --verbose \
            --scan-executable "$APP_PATH/$EXECUTABLE" \
            --scan-folder "$APP_PATH/Frameworks" \
            --destination "$APP_PATH/Frameworks" \
            --platform iphoneos
          # Fail early if any bundled binary still references an absent Swift runtime dylib.
          python3 - "$APP_PATH" <<'PYVERIFY'
          from pathlib import Path
          import subprocess, sys
          app = Path(sys.argv[1])
          frameworks = app / "Frameworks"
          binaries = [app / subprocess.check_output(
              ["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleExecutable", str(app / "Info.plist")],
              text=True).strip()]
          binaries += [p for p in frameworks.rglob("*") if p.is_file() and (p.suffix == ".dylib" or ".framework" in str(p) and p.name == p.parent.name)]
          missing = set()
          for binary in binaries:
              try:
                  output = subprocess.check_output(["/usr/bin/otool", "-L", str(binary)], text=True, stderr=subprocess.DEVNULL)
              except (subprocess.CalledProcessError, OSError):
                  continue
              for line in output.splitlines()[1:]:
                  dep = line.strip().split(" (", 1)[0]
                  if dep.startswith("@rpath/libswift") and dep.endswith(".dylib"):
                      name = Path(dep).name
                      if not (frameworks / name).is_file():
                          missing.add(f"{binary}: {name}")
          if missing:
              raise SystemExit("Missing embedded Swift runtime dependencies:\\n" + "\\n".join(sorted(missing)))
          # libswiftCoreMedia is intentionally not required here: FFmpeg's
          # CoreMedia C-symbol dependency was redirected to Apple's system
          # CoreMedia.framework above, so this Swift overlay may not be needed.
          print("Verified all remaining @rpath/libswift*.dylib dependencies are embedded.")
          PYVERIFY
          REPACK="$RUNNER_TEMP/TrapTube-runtime-fixed.ipa"
          (cd "$STAGING" && /usr/bin/zip -qry "$REPACK" Payload)
          mv "$REPACK" "$IPA"
          /usr/bin/unzip -tq "$IPA"
          /usr/bin/shasum -a 256 "$IPA" > work/TrapTube/dist/SHA256SUMS.txt

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrapTube-unsigned-IPA
          path: |
            work/TrapTube/dist/TrapTube-unsigned.ipa
            work/TrapTube/dist/SHA256SUMS.txt
            work/TrapTube/dist/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
