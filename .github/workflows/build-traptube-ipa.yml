name: Build TrapTube unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ci/source.bundle.part*'
      - '.github/workflows/build-traptube-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/source.bundle.part00 || { echo "Source bundle chunks are missing."; exit 2; }
          cat ci/source.bundle.part* > /tmp/source.bundle.zip.b64
          base64 --decode /tmp/source.bundle.zip.b64 > /tmp/source.bundle.zip
          unzip -tq /tmp/source.bundle.zip
          mkdir -p work
          unzip -oq /tmp/source.bundle.zip -d work
          test -f work/TrapTube/TrapTube.xcodeproj/project.pbxproj
      - name: Build iOS device app and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work/TrapTube
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh
      - name: Upload unsigned IPA and Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrapTube-unsigned-IPA
          path: |
            work/TrapTube/dist/TrapTube-unsigned.ipa
            work/TrapTube/dist/SHA256SUMS.txt
            work/TrapTube/dist/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
