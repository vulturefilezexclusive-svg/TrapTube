name: Build TrapTube unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ci/source.zip'
      - 'ci/patches/**'
      - '.github/workflows/build-traptube-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/source.zip || { echo "Upload the base project archive to ci/source.zip"; exit 2; }
          unzip -tq ci/source.zip
          mkdir -p work
          unzip -oq ci/source.zip -d work
          test -f work/TrapTube/TrapTube.xcodeproj/project.pbxproj
          test -f work/TrapTube/scripts/build-unsigned-ipa.sh

      - name: Apply BANDOTUBE source overlays
        shell: bash
        run: |
          set -euo pipefail
          cp ci/patches/AudioEngineManager.swift work/TrapTube/TrapTube/Services/AudioEngineManager.swift
          cp ci/patches/LibraryStore.swift work/TrapTube/TrapTube/Services/LibraryStore.swift
          cp ci/patches/ThemeManager.swift work/TrapTube/TrapTube/Services/ThemeManager.swift
          cp ci/patches/TypeTypeService.swift work/TrapTube/TrapTube/Services/TypeTypeService.swift
          cp ci/patches/StemSeparationService.swift work/TrapTube/TrapTube/Services/StemSeparationService.swift
          cp ci/patches/SettingsView.swift work/TrapTube/TrapTube/Views/SettingsView.swift
          cp ci/patches/YouTubeView.swift work/TrapTube/TrapTube/Views/YouTubeView.swift
          cp ci/patches/StemStudioView.swift work/TrapTube/TrapTube/Views/StemStudioView.swift
          cp ci/patches/HTDemucs-ATTRIBUTION.md work/TrapTube/TrapTube/Models/HTDemucs-ATTRIBUTION.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path("work/TrapTube/TrapTube/Views/Components.swift")
          source = path.read_text()
          source = source.replace('title: "YouTube"', 'title: "Videos"')
          path.write_text(source)
          PY

      - name: Download licensed HTDemucs Core ML model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://github.com/john-rocky/CoreML-Models/releases/download/demucs-v1/HTDemucs_SourceSeparation_F32.mlpackage.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$MODEL_URL" -o /tmp/HTDemucs_SourceSeparation_F32.mlpackage.zip
          unzip -tq /tmp/HTDemucs_SourceSeparation_F32.mlpackage.zip
          mkdir -p /tmp/htdemucs-unpacked
          unzip -oq /tmp/HTDemucs_SourceSeparation_F32.mlpackage.zip -d /tmp/htdemucs-unpacked
          MODEL_DIR="$(find /tmp/htdemucs-unpacked -type d -name 'HTDemucs_SourceSeparation_F32.mlpackage' -print -quit)"
          test -n "$MODEL_DIR"
          mkdir -p work/TrapTube/TrapTube/Models
          rm -rf work/TrapTube/TrapTube/Models/HTDemucs_SourceSeparation_F32.mlpackage
          cp -R "$MODEL_DIR" work/TrapTube/TrapTube/Models/HTDemucs_SourceSeparation_F32.mlpackage
          echo "Model package installed:"
          du -sh work/TrapTube/TrapTube/Models/HTDemucs_SourceSeparation_F32.mlpackage

      - name: Register Core ML model in Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/TrapTube/TrapTube.xcodeproj/project.pbxproj")
          s = p.read_text()
          build_id = "B10000000000000000000001"
          file_id = "B10000000000000000000002"
          if build_id not in s:
              build_entry = f'\t\t{build_id} /* HTDemucs_SourceSeparation_F32.mlpackage in Sources */ = {{isa = PBXBuildFile; fileRef = {file_id} /* HTDemucs_SourceSeparation_F32.mlpackage */; }};\n'
              s = s.replace("/* End PBXBuildFile section */", build_entry + "/* End PBXBuildFile section */")
          if file_id not in s:
              file_entry = f'\t\t{file_id} /* HTDemucs_SourceSeparation_F32.mlpackage */ = {{isa = PBXFileReference; lastKnownFileType = folder.mlpackage; path = HTDemucs_SourceSeparation_F32.mlpackage; sourceTree = "<group>"; }};\n'
              s = s.replace("/* End PBXFileReference section */", file_entry + "/* End PBXFileReference section */")
          models_group = "91EB64AA7329B36F8468A08D /* Models */ = {isa = PBXGroup; children = ("
          if models_group not in s:
              raise SystemExit("Could not find the Xcode Models group; refusing to guess project structure.")
          if file_id not in s[s.index(models_group):s.index("/* End PBXGroup section */")]:
              s = s.replace(models_group, models_group + f'{file_id} /* HTDemucs_SourceSeparation_F32.mlpackage */, ')
          sources_phase = "F612CD2E22E187AC48B5913C /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = ("
          if sources_phase not in s:
              raise SystemExit("Could not find the TrapTube Sources build phase.")
          if build_id not in s[s.index(sources_phase):s.index("/* End PBXSourcesBuildPhase section */")]:
              s = s.replace(sources_phase, sources_phase + f'{build_id} /* HTDemucs_SourceSeparation_F32.mlpackage in Sources */, ')
          attribution_file_id = "B10000000000000000000003"
          attribution_build_id = "B10000000000000000000004"
          if attribution_file_id not in s:
              attribution_file = f'\t\t{attribution_file_id} /* HTDemucs-ATTRIBUTION.md */ = {{isa = PBXFileReference; lastKnownFileType = text; path = "HTDemucs-ATTRIBUTION.md"; sourceTree = "<group>"; }};\n'
              s = s.replace("/* End PBXFileReference section */", attribution_file + "/* End PBXFileReference section */")
          if attribution_build_id not in s:
              attribution_build = f'\t\t{attribution_build_id} /* HTDemucs-ATTRIBUTION.md in Resources */ = {{isa = PBXBuildFile; fileRef = {attribution_file_id} /* HTDemucs-ATTRIBUTION.md */; }};\n'
              s = s.replace("/* End PBXBuildFile section */", attribution_build + "/* End PBXBuildFile section */")
          models_group_end = "/* End PBXGroup section */"
          if attribution_file_id not in s[s.index(models_group):s.index(models_group_end)]:
              s = s.replace(models_group, models_group + f'{attribution_file_id} /* HTDemucs-ATTRIBUTION.md */, ')
          resources_phase = "86F6FE2DD6E869C1842A14B3 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = ("
          if resources_phase not in s:
              raise SystemExit("Could not find the TrapTube Resources build phase.")
          if attribution_build_id not in s[s.index(resources_phase):s.index("/* End PBXResourcesBuildPhase section */")]:
              s = s.replace(resources_phase, resources_phase + f'{attribution_build_id} /* HTDemucs-ATTRIBUTION.md in Resources */, ')
          p.write_text(s)
          PY

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work/TrapTube
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrapTube-unsigned-IPA
          path: |
            work/TrapTube/dist/TrapTube-unsigned.ipa
            work/TrapTube/dist/SHA256SUMS.txt
            work/TrapTube/dist/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
